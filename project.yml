name: Rerack
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.mudit

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    # Single place that controls what's on the icon / in TestFlight — see
    # PRD Appendix A.0. Nothing else in the target settings should spell
    # the app's name out by itself.
    APP_DISPLAY_NAME: Rerack

targets:
  Rerack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Rerack
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/Rerack.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mudit.logbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mudit.logbook
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YHK4D97KC4
        SUPPORTS_MACCATALYST: NO
        # This is a pure SwiftUI app target — nearly everything is UI state,
        # so defaulting isolation to the main actor is the right call for
        # Swift 6 strict concurrency here rather than annotating every
        # @State-touching closure individually.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

schemes:
  Rerack:
    build:
      targets:
        Rerack: all
    run:
      config: Debug
    archive:
      config: Release
